name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build windows/Specula.Windows.sln -c Release --verbosity minimal
      - name: Test
        run: dotnet test windows/Specula.Windows.sln -c Release --no-build --verbosity normal
      - name: Publish
        run: dotnet publish windows/Specula.App/Specula.App.csproj -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: specula-windows-x64
          path: publish
          if-no-files-found: error
